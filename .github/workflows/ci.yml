name: ci

on:
  # Restrict push to the default branch. Without this, a push to a branch that
  # already has an open PR fires BOTH `push` and `pull_request`, so every job
  # runs twice (observed on #304: 8 checks for 4 jobs).
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref — a rapid series of pushes to one PR
# should not queue up N full CI runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zulip-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # "true" when anything other than documentation changed. Consumed by the
      # compat/tier2 jobs to skip ~390 MB host downloads for docs-only PRs.
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action needs full history to compute the PR diff range
          # (<head>^..<head>); a shallow clone breaks it with
          # "ambiguous argument ... unknown revision".
          fetch-depth: 0
      # NOTE: documentation changes must still run THIS job — ClawScan scans
      # docs/ and check:package asserts files referenced by package.json exist,
      # so a README edit can legitimately fail CI. Only the behavioural jobs are
      # skipped below.
      - id: filter
        name: Detect non-documentation changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base commit unavailable — assuming code changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          if [ -z "$changed" ]; then
            echo "no files changed"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE '\.md$|^docs/|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      # `check` already runs check:bootstrap, check:clawscan and check:audit.
      # Running them again as separate steps re-executed three of them twice for
      # no additional signal.
      - run: pnpm run check
      - name: gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce pristine working directory
        run: git diff --exit-code || { echo "Working directory is not clean. Lockfile or generated files might be out of sync."; false; }

  compat:
    # Wait for the fast job: there is no point spending 2 × ~390 MB on host
    # downloads when typecheck, the unit tests or the security gate already
    # failed. Skipped entirely for docs-only changes.
    needs: zulip-bridge
    if: needs.zulip-bridge.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every host version even if one fails — a cancelled sibling hides
      # whether the other version regressed.
      fail-fast: false
      matrix:
        openclaw: ["2026.7.1", "2026.9.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      # check:compat stages the plugin deps and the pinned host into a throwaway
      # workspace via npm; caching ~/.npm avoids re-downloading the ~390 MB host
      # tarball on every run. Key is versioned so it can be bumped if a cached
      # entry is ever written incomplete.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-openclaw-v1-${{ matrix.openclaw }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Host compatibility (tier 1) — openclaw@${{ matrix.openclaw }}
        run: COMPAT_VERSIONS=${{ matrix.openclaw }} pnpm run check:compat

  tier2:
    # See the compat job above for why this depends on zulip-bridge.
    needs: zulip-bridge
    if: needs.zulip-bridge.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-openclaw-v1-tier2
      - run: pnpm install --frozen-lockfile
      # check:tier2 copies dist/ + dist-cjs/ into a throwaway workspace, so the
      # build must run first (the runner fails loudly if artifacts are absent).
      - run: pnpm run build
      - name: Outbound behaviour (tier 2) — local fake Zulip server
        run: pnpm run check:tier2
