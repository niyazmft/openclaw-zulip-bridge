name: ci

on:
  push:
  pull_request:

jobs:
  zulip-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action needs full history to compute the PR diff range
          # (<head>^..<head>); a shallow clone breaks it with
          # "ambiguous argument ... unknown revision".
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - name: Verify bootstrap
        run: pnpm run check:bootstrap
      - run: pnpm run check
      - name: ClawScan replica (ClawHub moderation engine)
        run: pnpm run check:clawscan
      - name: npm audit (production deps)
        run: pnpm run check:audit
      - name: gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce pristine working directory
        run: git diff --exit-code || { echo "Working directory is not clean. Lockfile or generated files might be out of sync."; false; }

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openclaw: ["2026.7.1", "2026.9.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Host compatibility (tier 1) — openclaw@${{ matrix.openclaw }}
        run: COMPAT_VERSIONS=${{ matrix.openclaw }} pnpm run check:compat

  tier2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      # check:tier2 copies dist/ + dist-cjs/ into a throwaway workspace, so the
      # build must run first (the runner fails loudly if the artifacts are absent).
      - run: pnpm run build
      - name: Outbound behaviour (tier 2) — local fake Zulip server
        run: pnpm run check:tier2
